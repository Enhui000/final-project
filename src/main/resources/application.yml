spring:
    datasource:
        username: ${SPRING_DATASOURCE_USERNAME:root}
        password: ${SPRING_DATASOURCE_PASSWORD:}
        url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cs407_final_project?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
        driver-class-name: com.mysql.cj.jdbc.Driver
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        encoding: UTF-8
        table: flyway_schema_history
    data:
        redis:
            host: ${SPRING_REDIS_HOST:localhost}
            port: ${SPRING_REDIS_PORT:6379}
            password: ${SPRING_REDIS_PASSWORD:}
            database: ${SPRING_REDIS_DATABASE:0}
            timeout: ${SPRING_REDIS_TIMEOUT:5000ms}

mybatis-plus:
    global-config:
        db-config:
            id-type: auto
    configuration:
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    mapper-locations: classpath*:mapper/*.xml

app:
    jwt:
        secret: "7Phb6J1+R9nPZ1Gd4S7zPkbGQfBzg3ZPQmGq7qzW2t4="
        access-minutes: 60
        refresh-days: 14
    netty:
        port: 10827
