<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knot | Welcome</title>
    <link rel="stylesheet" href="auth.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-brand">
        <div class="brand-overlay"></div>
        <div class="brand-content">
          <div class="brand-logo">Knot</div>
          <h1>Connect. Explore. Grow.</h1>
          <p>
            Plan your adventures, stay in touch with friends, and keep every
            memory in one place. Sign in to continue or create a new account to
            get started.
          </p>
        </div>
      </section>
      <section class="auth-panel">
        <header class="panel-header">
          <button class="tab-button is-active" data-target="login-form">
            Sign In
          </button>
          <button class="tab-button" data-target="register-form">
            Create Account
          </button>
        </header>
        <div class="panel-body">
          <form id="login-form" class="auth-form is-active" novalidate>
            <div class="form-group">
              <label for="login-username">Username</label>
              <input
                type="text"
                id="login-username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
              />
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>
            <div class="form-meta">
              <label class="remember-me">
                <input type="checkbox" name="remember" />
                <span>Remember me</span>
              </label>
              <a href="#" class="placeholder-link">Forgot password?</a>
            </div>
            <button type="submit" class="primary-button">Sign In</button>
            <p class="form-hint">
              Need an account?
              <a href="#" data-switch="register-form">Create one here</a>.
            </p>
          </form>

          <form id="register-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="register-username">Username</label>
              <input
                type="text"
                id="register-username"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                required
              />
            </div>
            <div class="form-group">
              <label for="register-password">Password</label>
              <input
                type="password"
                id="register-password"
                name="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="form-group">
              <label for="register-confirm-password">Confirm password</label>
              <input
                type="password"
                id="register-confirm-password"
                name="confirmPassword"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="form-meta">
              <label class="remember-me">
                <input type="checkbox" required name="terms" />
                <span>I agree to the placeholder Terms of Service</span>
              </label>
            </div>
            <button type="submit" class="primary-button">Create Account</button>
            <p class="form-hint">
              Already registered?
              <a href="#" data-switch="login-form">Sign in instead</a>.
            </p>
          </form>
        </div>
        <footer class="panel-footer">
          <div class="divider">
            <span>or continue with</span>
          </div>
          <div class="social-buttons">
            <button type="button" class="social-button" disabled>
              <span class="icon" aria-hidden="true">🔒</span>
              Google (coming soon)
            </button>
            <button type="button" class="social-button" disabled>
              <span class="icon" aria-hidden="true">🔒</span>
              Apple (coming soon)
            </button>
          </div>
        </footer>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
